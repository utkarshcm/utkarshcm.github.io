.dots{display:inline-flex;gap:8px;align-items:center}
.dots button,#status .dots button{width:16px;height:16px;padding:0;border:3px solid;border-radius:50%}
.dots button.cur{outline:2px solid var(--ink);outline-offset:2px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:var(--bs,19px);line-height:1.55}
body.lock{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:2px dashed var(--accx);outline-offset:3px}
::selection{background:var(--hlc);color:inherit}
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--rule);border:2px solid transparent;background-clip:content-box}
h1,h2,h3{font-weight:500;line-height:1.2;margin:0}
h2{font-size:26px;margin-bottom:10px} h3{font-size:19px}
p{margin:0 0 12px}
.mono{font-family:var(--mono);font-size:13px;color:var(--mute)}
.chip{display:inline-block;border:1px solid var(--rule);padding:0 8px;margin:0 6px 6px 0;font:12px var(--mono);color:var(--ink)}
.btn{display:inline-block;border:1px solid var(--sec,var(--brass));background:none;color:var(--sec,var(--accx));padding:6px 14px;font:13px var(--mono);text-decoration:none}
.btn:hover{background:var(--sec,var(--brass));color:var(--on)}
.btn.solid{background:var(--brass);border-color:var(--brass);color:var(--on)} .btn.solid:hover{background:none;color:var(--accx)}

/* reading mode */
#read{min-height:100%;overflow-x:hidden;background-color:var(--bg);padding-bottom:96px}
#read main{position:relative;z-index:1}
#rwall{position:fixed;inset:0;z-index:0;opacity:.2}
.dock svg{width:22px;height:22px}.dock svg rect{opacity:.55}.dock a.cur svg rect{opacity:1}
.topline{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--rule);display:none;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.topnav{display:none;gap:18px;align-items:center;font:13px var(--mono)} .topnav a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent} .topnav a:hover{border-color:var(--accx)}
.col{max-width:680px;margin:0 auto;padding:0 18px}
.anchor{scroll-margin-top:76px}
:root{--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.hand{font:13px var(--mono);color:var(--mute)}
.rule{height:1px;background:var(--rule);margin:12px 0 22px}
.bar{width:56px;height:2px;background:var(--accx);margin:14px 0 8px}
.nowl{display:grid;grid-template-columns:84px 1fr;gap:8px 16px;margin:12px 0 4px}.nowl dt{font:600 11px var(--serif);letter-spacing:.14em;color:var(--mute);padding-top:5px}.nowl dd{margin:0}.nowl dt.nowd{grid-column:1/-1;padding:0;text-transform:none;letter-spacing:.02em;font:12px var(--mono)}.nowl dd:empty{display:none}
.kick{font:600 11px var(--serif);letter-spacing:.14em;color:var(--accx);margin:0 0 6px}
.cp{font-style:normal;font-size:1.3em;letter-spacing:.1em;line-height:0}
.ctab span{display:block;line-height:1;padding-top:1px}
#read h2.sec{font:var(--hw) clamp(32px,9vw,44px)/1.05 var(--head);letter-spacing:-.01em;margin:0 0 8px}
.hero{padding:34px 18px 0}
.hero h1{font:var(--hw) clamp(50px,15vw,84px)/1 var(--head);letter-spacing:-.02em}
.scrib,.squig{display:block;fill:none;stroke:var(--accx);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.scrib{width:min(330px,78%);height:14px;margin:8px 0 6px}
.squig{width:100%;height:12px;margin:10px 0 18px}
.scrib path,.squig path{vector-effect:non-scaling-stroke}
.role{font:13px var(--mono);color:var(--accx);margin:14px 0 18px;letter-spacing:.05em}
.lede{font-size:var(--ls,22px);line-height:1.5}
mark.hl{background:none;color:inherit;border-bottom:1px solid var(--accx);padding:0}
:root{--hlc:rgba(217,138,78,.4)}
[data-theme=chalkblue]{--hlc:rgba(47,88,200,.2)}[data-theme=chalkgold]{--hlc:rgba(166,118,0,.25)}[data-theme=chalkviolet]{--hlc:rgba(106,77,184,.2)}[data-theme=concrete]{--hlc:rgba(166,58,34,.25)}[data-theme=chalk]{--hlc:rgba(166,58,34,.25)}[data-theme=night]{--hlc:rgba(194,161,91,.35)}[data-theme=clay]{--hlc:rgba(122,46,63,.25)}[data-theme=moss]{--hlc:rgba(98,114,58,.3)}[data-theme=signal]{--hlc:rgba(255,90,54,.3)}[data-theme=ocean]{--hlc:rgba(217,138,78,.42)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.card{position:relative;margin:44px 0;background:var(--surf);border:1px solid var(--rule);outline:1px solid var(--rule);outline-offset:3px;padding:24px 18px 16px}
.ctab{position:absolute;left:-1px;top:-24px;height:24px;box-sizing:border-box;display:flex;align-items:center;padding:0 12px;background:var(--cp,var(--pc,var(--brass)));color:var(--tc,var(--on));font:600 11px var(--serif);letter-spacing:.14em;z-index:1}
.kv{display:grid;grid-template-columns:92px 1fr;gap:8px 12px;align-items:baseline}
.kv .k{font:12px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.polaroid{position:relative;width:min(220px,72%);margin:4px 0 22px;border:1px solid var(--rule);padding:0}
.polaroid .ph{aspect-ratio:1;background:var(--surf2);display:grid;place-items:center;overflow:hidden}
.polaroid img{width:100%;height:100%;object-fit:cover}
.ph svg{width:72%;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.ph svg .f{fill:var(--ink)}
.polaroid figcaption{text-align:center;padding:6px 0 2px;font-size:26px}

.stack{position:relative;margin-top:36px}
.stack .card{position:sticky;top:calc(74px + var(--i)*12px);margin:0 0 52px}
body.blocks .stack .card{top:calc(var(--skyH) + 16px + var(--i)*10px)}
.stack .card h3{font:var(--hw) clamp(26px,7vw,32px)/1.1 var(--head);margin:2px 0 8px}
.st{position:absolute;top:10px;right:12px;font:11px var(--mono);border:1px solid var(--pc);color:var(--pc);padding:0 7px;text-transform:uppercase;letter-spacing:.08em}
.res{margin:0 0 12px;padding-left:12px;border-left:3px solid var(--pc)}
.kit{margin-top:6px}.krow{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:10px 0;border-top:1px solid var(--rule)}.krow b{font-weight:500}.krow small{grid-column:1/-1;color:var(--mute);font-size:15px;line-height:1.35}.krow .pips{color:var(--accx)}
.band{background:var(--ink);color:var(--bg);padding:8px 0 34px}
.band .kick{color:var(--surf2)}
.trow{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px dashed rgba(255,255,255,.25)}
.trow:first-of-type{border-top:0}
.lbl{justify-self:start;color:var(--bg);font:var(--hw) 20px var(--head)}
.trow .pips{justify-self:end;color:var(--bg)}
.trow small{grid-column:1/-1;color:var(--surf2);font-size:17px;line-height:1.35}
.pips{font:12px var(--mono);letter-spacing:3px;white-space:nowrap}
.legend{font:12px var(--mono);color:var(--mute);margin:12px 0 0}
.mail{display:inline-block;font:500 clamp(18px,5vw,23px) var(--serif);word-break:break-all;margin:4px 0 14px}
.thanks{text-align:center;padding:26px 0 40px}.thanks .hand{display:block;margin-bottom:14px}
.wideonly{display:none;margin:16px 0 0}
a.u{text-decoration:none;background-image:linear-gradient(var(--hlc),var(--hlc));background-size:100% 35%;background-position:0 92%;background-repeat:no-repeat;color:var(--ink);transition:background-size .15s steps(3)} a.u:hover{background-size:100% 85%}
.dock{position:fixed;left:0;right:0;bottom:0;height:60px;background:var(--bg);border-top:1px solid var(--rule);display:flex;z-index:40}
.dock a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);text-decoration:none;font:11px var(--mono)}
.dock a.cur{color:var(--accx);box-shadow:inset 0 2px 0 var(--accx)}
@media (min-width:760px){.dock{display:none}.topline{display:flex}.topnav{display:flex}#read{padding-bottom:40px}.wideonly{display:block}}
:root{--head:var(--serif);--hw:400;--bs:19px;--ls:22px}
html[data-kit=b]{--serif:'Inter',system-ui,sans-serif;--head:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--hw:500;--bs:17px;--ls:20px}
html[data-kit=b] .hero h1,html[data-kit=b] #read h2.sec{letter-spacing:-.035em}

html[data-kit=c] .hero h1{font-size:clamp(56px,16vw,96px)}
html[data-kit=d]{--serif:'IBM Plex Sans',system-ui,sans-serif;--head:'IBM Plex Serif',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--hw:500;--bs:17px;--ls:20px}
html[data-kit=d] .hero h1,html[data-kit=d] #read h2.sec{letter-spacing:-.015em}
.dots button.kitb,#status .dots button.kitb{width:auto;height:22px;padding:0 8px;border:1px solid var(--rule);border-radius:0;background:none;font:12px var(--mono);color:var(--ink);margin-left:6px;white-space:nowrap;cursor:pointer}.dots button.kitb:hover{border-color:var(--accx)}

html[data-kit=f]{--serif:Georgia,'Times New Roman',serif;--head:'Archivo Black','Arial Black',Arial,sans-serif;--mono:Arial,Helvetica,sans-serif;--hw:400;--bs:18px;--ls:21px}
html[data-kit=f] .hero h1{font-size:clamp(28px,8vw,56px);text-transform:uppercase;letter-spacing:-.01em;line-height:1.02}

.dots button.capb,#status .dots button.capb{width:auto;height:22px;padding:0 8px;border:1px solid var(--rule);border-radius:0;background:none;font:12px var(--mono);color:var(--ink);margin-left:6px;white-space:nowrap;cursor:pointer}.dots button.capb.cur{background:var(--ink);color:var(--bg)}
/* block menu (wide screens) */
:root{--cell:26px;--skyH:76px;--floorH:74px;--sy:0px}
#skyfade,#floorfade,#well,#blocks,#status{display:none}
body.blocks #skyfade,body.blocks #floorfade,body.blocks #well,body.blocks #blocks{display:block}
body.blocks #status{display:flex}
body.blocks .topline,body.blocks #rwall{display:none}
/* block mode: use the width. Text sections span the page, cases pair up, resume and contact sit side by side. */
body.blocks #read main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;max-width:min(1160px,calc(100vw - 64px));margin:0 auto}
body.blocks #read main>.col{max-width:none;margin:0;width:auto}
body.blocks #read main>.col.wide,body.blocks #read main>.col.term-col{grid-column:1/-1}
body.blocks #read main>.col.term-col{max-width:680px;width:100%;margin:0 auto}
body.blocks .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:52px 24px;align-items:start}
body.blocks .stack .card{position:static;margin:0}
body.blocks .stack .card:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 12px)}
body.blocks #read{padding-top:calc(var(--skyH) + 6px);padding-bottom:calc(var(--floorH) + 56px)}
#skyfade{position:fixed;left:0;right:0;top:0;height:var(--skyH);background:var(--bg);border-bottom:1px solid var(--rule);box-sizing:border-box;z-index:4990;pointer-events:none;transform:translateY(var(--sy));transition:transform .28s ease}
#floorfade{position:fixed;left:0;right:0;bottom:0;height:calc(var(--floorH) + 32px);background:var(--bg);border-top:1px solid var(--rule);box-sizing:border-box;z-index:4990;pointer-events:none}
#well{position:fixed;z-index:4998;pointer-events:none;border:1px solid var(--rule);border-bottom-color:var(--mute);background-image:linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:var(--cell) 100%}
#well::before,#well::after{content:"";position:absolute;bottom:100%;height:var(--cell);border-left:1px solid var(--rule)}
#well::before{left:-1px}#well::after{right:-1px}
#well .fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s}
#well.empty .fill{opacity:1}
#well .fill span{background:var(--bg);padding:2px 16px;font:400 14px var(--serif);color:var(--mute)}
#blocks{position:fixed;inset:0;z-index:5000;pointer-events:none}
.pc{position:absolute;display:block;padding:0;border:0;background:none;pointer-events:none;font:inherit;filter:drop-shadow(0 1px 1.5px rgba(20,12,40,.14))}
.pc.down{filter:drop-shadow(0 1px 1px rgba(20,12,40,.16))}
.pc:not(.down){translate:0 var(--sy,0px);transition:translate .28s ease}

  posts:[{slug:'call-of-duty-skill-not-spectacle',title:'(Margin) Call of Duty',date:'2026-10-17',tags:['gaming','strategy'],md:`Call of Duty has had a long history in gaming, and in culture more broadly. PewDiePie, one of the biggest YouTubers in a previous era, got his start posting Call of Duty gameplay. It’s a core childhood memory for most of Gen Z, and nearly everyone knows someone who has put hundreds of hours into it. But the shooter market has changed since Call of Duty’s early years, and the franchise has had to change with it.

Two shifts mattered most:
1. Fortnite popularized the free-to-play battle royale model.
2. Mobile gaming matured around the same freemium logic.

Call of Duty answered both, first with Call of Duty: Mobile in 2019, then with Warzone in 2020.

The biggest of those changes has been the rise of collaborations with real-world artists and franchises. Travis Scott’s Fortnite concert, during the pandemic, started it. Now every major shooter is chasing a version of the same idea, from music artists to anime IPs like Gundam. Call of Duty has done its share:
- A 50th-anniversary-of-hip-hop collaboration, criticized for undercutting the game’s military-sim identity.
- A Homelander crossover that gave players his laser vision, letting them vaporize enemies on sight the way Battlefront let players dominate a battlefield with a hero unit.

Both sit uneasily next to the realism Warzone is supposed to stand for.

And yet Call of Duty can’t ignore what these collaborations do for other games. Apex Legends’ collaboration with Gundam coincided with Steam concurrent players climbing from roughly 203,000 to a 261,786 peak, a jump of about 29%. Fortnite runs collaborations constantly because of the revenue they generate. Brands and artists, in turn, keep showing up, chasing the same audience.

So: should Call of Duty keep doing these collaborations? And if so, how?

Warzone’s biggest spike tied to a single content decision, rather than a collaboration, came from the re-release of Verdansk, a map from the game’s original 2020 release. That’s worth sitting with. It means the players who want a grounded, realistic battle royale are a larger group than the industry’s current direction would suggest. Bringing back Captain Price and Soap as playable operators likely did far less for the game than bringing back the old map did, though Activision has never published the operator-level data needed to confirm that directly. The map met a need the celebrity crossovers didn’t.

Realism can’t be Call of Duty’s unique selling point on its own. PUBG and Arc Raiders occupy similar ground. But Steam data shows Verdansk’s return mostly brought back players who already owned the game, which points to something more specific than nostalgia: the map’s power balance (its slower pace, its absence of fast traversal gimmicks) met a need nothing else in the game currently does.

That need has a name: power creep. A popular guest character is a strong hook for new players. But it works against keeping them, because sooner or later a player gets crushed by someone playing as a hero unit built to dramatically outclass everyone else on the field, and that isn’t fun to be on the losing end of. Star Wars Battlefront II was undone partly by this same problem. Heroes like Darth Vader and Luke Skywalker were designed to be far stronger than a regular trooper by default, and the game layered a pay-to-win credit system on top, letting players buy their way to those same heroes and their stat upgrades faster than players who didn’t spend. The backlash was severe enough that EA eventually stripped power-affecting purchases from the game entirely. Every game chasing the same built-in-imbalance model risks the same fate. These crossovers are good at getting new players in the door. They’re much worse at keeping them there.

Call of Duty’s constraint is a more grounded, realistic world. That turns out to be a blessing in disguise: it frees the studio to spend resources on gameplay loops that reward player skill directly, rather than on a randomized power fantasy. There’s a reason Battlefield 2042’s reveal trailer leaned on the "Rendezook," a stunt invented by players years earlier: eject from your own jet mid-air, shoot down the enemy jet with a rocket launcher, then land back in your seat. No random drop made that moment possible. Only the player’s own execution did, which is exactly why DICE built a piece of official marketing around something the community had invented for itself, and it resonated as planned.

That settles the what. The harder question is the how: how Call of Duty turns this into revenue for Activision.

Competing head-on with a game like Arc Raiders is difficult. Call of Duty already carries a large roster of modes, and adding more risks bloating the game and driving up maintenance costs. A better model may sit elsewhere in the industry. Epic’s creator economy keeps players inside Fortnite and creates real revenue for Epic in the process. Warzone could build something comparable:
1. A marketplace where creators sell their own skins.
2. A modern version of the Steam Workshop tools Black Ops III once offered for community-made maps.
3. Direct commissions, with Activision paying creators to build 1-of-1 skins.

A rewarding core loop matters just as much as any of this. Arc Raiders’ near-permadeath mechanic (lose a fight, lose your inventory) is a real part of its appeal. I wouldn’t want Call of Duty to copy that outright, at the risk of being called a ripoff. But the underlying idea, tightening the core gameplay loop so skill matters more than chance, is worth pursuing on its own terms. By the community’s own account, Gulag weapon randomness and ground-loot RNG already make matches feel more luck-driven than they should.

All this points toward the same goal: retaining the seasoned players already in Warzone, and slowing any drift toward other games. That’s the most important audience a live-service game has. Without a committed core, no new player has a reason to look twice.

Call of Duty sits on one of the deepest legacies in first-person shooters. What it’s missing isn’t a new gimmick. It’s the discipline to let its one real advantage, a world built on skill and not luck, be the thing the whole strategy is built around.`}],

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const inl=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:|#)[^)\s]+)\)/g,'<a href="$2">$1</a>');
function md(src){const out=[],L=src.replace(/\r/g,'').split('\n');let i=0,m;
  const stop=/^(#{1,3}\s|```|>|[-*]\s|\d+\.\s|---+\s*$)/;

    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue}
    if(!l.trim()){i++;continue}
    if(m=l.match(/^(#{1,3})\s+(.*)/)){const n=m[1].length+1;out.push(`<h${n}>${inl(m[2])}</h${n}>`);i++;continue}
    if(/^---+\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^>/.test(l)){const b=[];while(i<L.length&&/^>/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));out.push('<blockquote>'+inl(b.join(' '))+'</blockquote>');continue}
    if(/^[-*]\s+/.test(l)){const b=[];while(i<L.length&&/^[-*]\s+/.test(L[i]))b.push(L[i++].replace(/^[-*]\s+/,''));out.push('<ul>'+b.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>');continue}
    if(/^\d+\.\s+/.test(l)){const b=[];while(i<L.length&&/^\d+\.\s+/.test(L[i]))b.push(L[i++].replace(/^\d+\.\s+/,''));out.push('<ol>'+b.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ol>');continue}
    const b=[];while(i<L.length&&L[i].trim()&&(!b.length||!stop.test(L[i])))b.push(L[i++]);out.push('<p>'+inl(b.join(' '))+'</p>');
  }
  return out.join('\n')}

function mkRng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function blockWall(w,h,seed,cs,maxRows,xo=0){
  const r=mkRng(seed),cols=Math.ceil(w/cs)+2,pal=Object.values(PIECE).map(v=>v[1]);let o='';

function buildPieces(){
  const host=$('#blocks');let slot=0;
  ORDER.forEach((k,i)=>{
    const [sh,col]=PIECE[k],{w,h}=dims(sh);
    const cells=r=>SHAPES[sh].map(([x,y])=>`<i class="cl"${r?` data-r="${y}"`:''} style="left:calc(var(--cell)*${x});top:calc(var(--cell)*${y})"></i>`).join('');

function onPiece(k){

  const fin=()=>{p.el.style.left=to.x+'px';p.el.style.top=to.y+'px';try{a.cancel()}catch(e){}done()};

}

const SCENARIOS=[

   ['Stays short (under 70 words)',r=>r.trim().split(/\s+/).length<70]
  ],
  tip:'Ask two things at most: which numbers, and by when. Then commit to a time.'},
 {from:'Marcus (VP Ops)',subj:'Re: Re: Re: plan',sent:'Sent from my iPad',body:'this doesnt look right. can we revisit. thx',
  note:'You sent the Q4 capacity plan on Monday. Marcus has not said which part looks wrong.',
  needs:[
   ['Does not get defensive',r=>!/(no,? it is|it is right|you are wrong|you\'re wrong|actually,? it)/i.test(r)],
   ['Asks which part looks off',/which|what (part|number|assumption)|where|section|slide|tab|row/i],
   ['Offers a concrete next step or time',/call|min(ute)?s?\b|tomorrow|today|\b\d{1,2}\s?(am|pm)|walk (you )?through|send/i],

function termInit(el){
  const out=el.querySelector('.out'),inp=el.querySelector('input'),pr=el.querySelector('form span');
  const say=(t,c)=>{const d=document.createElement('div');if(c)d.className=c;d.innerHTML=t;out.append(d);out.scrollTop=out.scrollHeight};
  const echo=v=>{const d=document.createElement('div');d.textContent=pr.textContent+' '+v;out.append(d)};
  let mode='idle',sc=-1,hist=[],hi=0,started=false;
  const ALIAS={about:'about',work:'projects',projects:'projects',writing:'writing',resume:'resume','résumé':'resume',contact:'mail',terminal:'term'};
  const NAMES=['help','whoami','ls','open','menu','achievements','theme','game','history','clear','sudo','exit'];
  function setMode(m){mode=m;pr.textContent=m==='game'?'reply>':'$'; inp.setAttribute('aria-label',m==='game'?'your reply':'command')}
  function showEmail(){
    const e=SCENARIOS[sc];
    say('<b>━━ NEW EMAIL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</b>');
    say('From:    '+esc(e.from)+'\nSubject: '+esc(e.subj)+'\n\n  '+esc(e.body)+'\n\n  '+esc(e.sent)+'\n<b>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</b>');
    say('<i>'+esc(e.note)+'</i>');
    say('Type your reply and press Enter. <b>Ctrl+C</b> (or type <b>exit</b>) for a command line.','dim');
  }
  function nextEmail(){sc=(sc+1)%SCENARIOS.length;setMode('game');showEmail()}
  function judge(r){
    const e=SCENARIOS[sc],nm=e.from.split(/[ (]/)[0];let n=0;
    say('');
    e.needs.forEach(([label,t])=>{const ok=typeof t==='function'?t(r):t.test(r);if(ok)n++;say((ok?'  [x] ':'  [ ] ')+esc(label))});
    const total=e.needs.length;
    say('\n'+(n===total?'<b>'+nm+' reads it once and relaxes.</b> '+n+'/'+total:(n>=total-1?'Close. '+nm+' will probably follow up. ':nm+' will now spend ten minutes guessing. ')+n+'/'+total));
    if(n<total)say('<i>'+esc(e.tip)+'</i>');
    say('\nPress Enter for the next email, or Ctrl+C for a command line.','dim');
    mode='await';
  }
  function toShell(viaKey){
    if(mode==='shell')return;
    say(viaKey?'^C':'');say('game paused. this is a command line now. type <b>help</b>, or <b>game</b> to go back.');setMode('shell');
  }
  const cmds={
    help:()=>'help, whoami, ls, open &lt;about|work|writing|resume|contact|terminal&gt;, menu &lt;plain|blocks&gt;, achievements, theme [name], game, history, clear, exit',
    whoami:()=>esc(C.name+' — '+C.role),
    ls:()=>ORDER.map(k=>LABEL[k].toLowerCase()).join('  '),
    clear:()=>{out.innerHTML='';return ''},
    history:()=>hist.map((h,i)=>(i+1)+'  '+esc(h)).join('\n')||'(empty)',
    achievements:()=>Object.entries(ACH).map(([k,[n,d]])=>(got.has(k)?'[x] '+esc(n):'[ ] ???')+' — '+esc(d)).join('\n'),
    theme:a=>{if(a){if(!THEMES.some(x=>x[0]===a))return 'themes: '+THEMES.map(x=>x[0]).join(', ');setTheme(a)}else cycleTheme();return 'ok.'},
    menu:a=>{if(a==='plain'||a==='blocks'){setPlain(a==='plain');return 'menu: '+a}return 'usage: menu plain | menu blocks'},
    sudo:()=>'nice try. this is a portfolio, not a production database.',
    game:()=>{nextEmail();return ''},
    exit:()=>'you are already in the command line.',
    open:a=>{const k=ALIAS[(a||'').toLowerCase()];if(!k)return 'no such section: '+esc(a||'');blocksOn()&&PCS[k]?onPiece(k):goSec(k);return 'opening '+esc(a)+'...'}
  };
  function guess(c){let best=null,bd=3;NAMES.forEach(n=>{const d=lev(c,n);if(d<bd){bd=d;best=n}});return best}
  function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)m[0][j]=j;
    for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
  function runShell(v){
    const [c,...r]=v.split(/\s+/);const f=cmds[c.toLowerCase()];
    if(f){const res=f(r[0]);if(res)say(res)}
    else{const g=guess(c.toLowerCase());say('command not found: '+esc(c)+(g?'. did you mean <b>'+g+'</b>?':''))}
  }
  el.querySelector('form').onsubmit=e=>{
    e.preventDefault();const v=inp.value.trim();inp.value='';
    if(mode==='idle')return;
    if(mode==='await'){echo(v);if(v.toLowerCase()==='exit')toShell();else nextEmail();return}
    if(!v)return;
    echo(v);hist.push(v);hi=hist.length;unlock('hack');

  inp.addEventListener('keydown',e=>{
    if(e.ctrlKey&&e.key.toLowerCase()==='c'&&!(inp.selectionStart!==inp.selectionEnd)){e.preventDefault();inp.value='';if(mode==='idle'){started=true}toShell(true);return}
    if(mode==='shell'){

      else if(e.key==='ArrowDown'){e.preventDefault();hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||''}
      else if(e.key==='Tab'){e.preventDefault();const v=inp.value.trim().toLowerCase();if(v&&!v.includes(' ')){const m=NAMES.filter(n=>n.startsWith(v));if(m.length===1)inp.value=m[0]+' ';else if(m.length>1)say(m.join('  '))}}
    }
  });
  el.querySelector('.termbox').addEventListener('click',()=>inp.focus({preventScroll:true}));
  const boot=()=>{if(started)return;started=true;say('booting <b>inbox.exe</b> ...','dim');setTimeout(()=>{sc=-1;nextEmail()},450)};
  new IntersectionObserver((en,o)=>{if(en[0].isIntersecting){boot();o.disconnect()}},{threshold:.35}).observe(el.querySelector('.termbox'));
}

function tearPath(seed){let r=seed;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};let d='M0 22 L0 '+(6+rnd()*8).toFixed(1);for(let x=9;x<400;x+=9+rnd()*9)d+=' L'+x.toFixed(0)+' '+(3+rnd()*13).toFixed(1);return d+' L400 '+(6+rnd()*8).toFixed(1)+' L400 22 Z'}
const tear=()=>'';
const squig=()=>`<div class="rule"></div>`;
const scrib=()=>`<div class="bar"></div>`;
const badge=(id='bp')=>{const t=(C.status||'Open to work').toUpperCase(),r=(t+' • ').repeat(Math.max(1,Math.round(26/(t.length+3))));return `<svg class="badge" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="46"/><path id="${id}" d="M48 48 m-34 0 a34 34 0 1 1 68 0 a34 34 0 1 1 -68 0" fill="none"/><text><textPath href="#${id}" textLength="205" lengthAdjust="spacing">${esc(r)}</textPath></text><circle class="dot" cx="48" cy="48" r="5"/></svg>`};
const photo=()=>`<figure class="polaroid"><div class="ph">${C.photo?`<img src="${esc(C.photo)}" alt="Portrait of ${esc(C.name)}">`:`<span class="mono">photo</span>`}</div></figure>`;
const lede=()=>esc(C.blurb).split(/\n\n/).map(t=>`<p class="lede">${t}</p>`).join('');
const dayStr=new Date().toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});

$('#read').innerHTML=`
<div id="rwall" class="wallbox"></div>
<div class="topline"><span class="mono">~/${esc(C.name.toLowerCase().replace(/\s+/g,'-'))}</span><span class="topnav">${ORDER.map(k=>`<a href="#${SEC[k]}">${LABEL[k].toLowerCase()}</a>`).join('')}<a href="#" id="toblocks">block menu</a></span></div>
<main>
<div class="col hero wide">
  <h1>${esc(C.name)}</h1>${scrib()}
  <div class="role">${esc(C.role)}</div>
  ${lede()}
  <div class="cta"><a class="btn solid" href="${esc(C.resume)}" target="_blank" rel="noopener">Résumé</a><a class="btn" href="#contact-sec">Get in touch</a></div>
</div>
<div class="col wide">
  <section class="card anchor" id="about-sec" style="--pc:var(--brass)"><div class="ctab"><span>${sc("01 — about")}</span></div>${C.about.map(t=>`<p>${esc(t)}</p>`).join('')}<div class="kv" style="margin-top:14px">${C.facts.map(([k,v])=>`<span class="k">${esc(k)}</span><span>${esc(v)}</span>`).join('')}</div><details class="case now"><summary>What I’m up to now</summary><dl class="nowl"><dt class="nowd">As of ${esc(dayStr)}</dt><dd></dd>${C.now.map(([k,v])=>`<dt>${sc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details></section>
</div>
<div class="col wide anchor" id="work-sec" style="margin-top:56px">
  <div class="kick">${sc("02 — work")}</div><h2 class="sec">Only the greatest hits</h2>${squig()}
  <div class="stack">${C.projects.map((p,i)=>`<article class="card" style="--i:${i};--r:${ROT[i%4]}deg;--pc:var(--accx);--cp:color-mix(in srgb,var(--accx) ${100-[0,15,29,44,58][i%5]}%,#fff);--tc:${i<2?'#fff':'#150c2e'}"><div class="ctab"><span>${sc("case_"+String(i+1).padStart(2,"0"))}</span></div><span class="st">${esc(p.s)}</span><h3>${esc(p.n)}</h3><p>${esc(p.d)}</p><p class="res">${esc(p.r)}</p><details class="case"><summary>Read the case</summary>${caseDL(p,true)}</details>${p.t.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</article>`).join('')}</div>
</div>
<div class="col wide anchor" id="writing-sec" style="margin-top:40px">
  <div class="kick">${sc("03 — writing")}</div><h2 class="sec">Writing</h2>${squig()}
  ${C.posts.length?featured():`<p>No posts yet. The first one is in progress.</p><p class="mono">New posts will show up here.</p>`}
</div>

<div class="col anchor" id="resume-sec" style="margin-top:56px">
  <div class="kick">${sc("04 — résumé")}</div><h2 class="sec">The short version</h2>${squig()}
  <section class="card" style="--pc:var(--ink)"><div class="ctab"><span>${sc("resume")}</span></div><div class="kv"><span class="k">MBA</span><span>Vanderbilt Owen, 2026</span><span class="k">Deloitte</span><span>Cloud pricing and strategy, 2021 to 2024</span><span class="k">ServiceNow</span><span>Strategy internship</span><span class="k">B.Tech</span><span>Computer Science, 2021</span></div><details class="case" style="margin-top:16px"><summary>Skills and tools</summary><div class="kit">${C.tools.map(t=>`<div class="krow"><b>${esc(t[0])}</b><span class="pips" title="${esc(t[1])}">${pipsOf(t[1])}</span><small>${esc(t[2])}</small></div>`).join('')}<p class="legend">●●● daily · ●●○ solid · ●○○ learning</p></div></details><div class="cta" style="margin:16px 0 0"><a class="btn solid" href="${esc(C.resume)}" target="_blank" rel="noopener">Download résumé</a></div></section>
</div>
<div class="col anchor" id="contact-sec" style="margin-top:56px">
  <div class="kick">${sc("05 — contact")}</div><h2 class="sec">Say hello.</h2>${squig()}
  <section class="card" style="--pc:var(--teal)"><div class="ctab"><span>${sc("contact")}</span></div><p style="margin:0 0 4px">Reach out if you’d like to hire me, or just to have a chat!</p><a class="mail u" href="mailto:${esc(C.email)}">${esc(C.email)}</a><p style="margin:0">${C.links.map(([n,u])=>`<a class="u" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join(' &nbsp; ')}</p></section>
</div>
<div class="col term-col anchor" id="terminal-sec" style="margin-top:56px">
  <div class="kick">${sc("06 — terminal")}</div><h2 class="sec">Poke around.</h2>${squig()}
  <div class="termbox"><div id="term"><div class="out"></div><form autocomplete="off"><span>&gt;</span><input spellcheck="false" aria-label="command"></form></div></div>
  <p class="mono" style="margin:10px 0 0;color:var(--mute);font-size:12px">A small game about vague emails. Ctrl+C for a command line.</p><div class="thanks"><span class="hand">End of page</span><button class="btn" id="top">↑ back to top</button></div>
</div>
</main>
<nav class="dock" aria-label="Sections">${[['about','about-sec','About'],['projects','work-sec','Work'],['resume','resume-sec','Résumé'],['mail','contact-sec','Contact']].map(([k,id,l])=>`<a href="#${id}" data-sec="${id}" data-k="${k}">${mini(k)}<span>${l}</span></a>`).join('')}</nav>`;

/* links scroll with our own easing */
const SECK=Object.fromEntries(Object.entries(SEC).map(([k,v])=>[v,k]));
document.querySelectorAll('#read a[href$="-sec"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const k=SECK[a.getAttribute('href').slice(1)];blocksOn()&&PCS[k]?onPiece(k):goSec(k)}));
$('#top').onclick=()=>{scrollToY(0);try{history.replaceState(null,'',location.pathname)}catch(e){}};
termInit($('#terminal-sec'));

/* ---------- menu mode ---------- */
setTheme('chalkviolet');setKit('e');setCaps(false);
let plain=false,ready=false;try{plain=localStorage.getItem('mlplain')==='1'}catch(e){}
const wide=matchMedia('(min-width:760px) and (min-height:560px)');
function applyNav(){
  const on=wide.matches&&!plain;
  document.body.classList.toggle('blocks',on);document.body.classList.toggle('plain',plain);
  if(on){if(!built){buildPieces();built=true}geom();placeAll();syncFloor();curSec=undefined}
  renderWalls();foundRender();spy();
}
function setPlain(v){plain=v;try{localStorage.setItem('mlplain',v?'1':'0')}catch(e){}applyNav();if(v)unlock('plain')}
$('#plainbtn').onclick=()=>setPlain(true);
$('#toblocks').onclick=e=>{e.preventDefault();setPlain(false)};
let _rw;addEventListener('resize',()=>{clearTimeout(_rw);_rw=setTimeout(()=>{if(!busy&&noneFlying()||!built)applyNav()},120)});
wide.addEventListener('change',applyNav);
applyNav();ready=true;lastY=scrollY;
const _h=location.hash.slice(1);if(_h&&SECK[_h])setTimeout(()=>goSec(SECK[_h]),60);
/* ---------- writing page routes ---------- */
const BASE_TITLE=document.title;let homeY=0,inView=false;
function renderPage(slug){
  const top=`<div class="ptop"><div class="in"><a class="nm" href="#">${esc(C.name)}</a><span><a href="#/writing">Writing</a></span></div></div>`;
  const q=slug&&C.posts.find(p=>p.slug===slug);
  if(slug&&!q)return {title:'Not found',html:top+`<div class="art"><h1>Not found</h1><p>No post with that address. <a href="#/writing" style="color:var(--accx)">See all writing</a>.</p></div>`};
  if(q)return {title:q.title,html:top+`<article class="art"><h1>${esc(q.title)}</h1><div class="meta">${postMeta(q)}</div>${q.placeholder?`<div class="note">Placeholder article. Not written by Utkarsh; replace before sharing.</div>`:''}<div class="body">${md(q.md)}</div><div class="foot"><a href="#/writing">← All writing</a><a href="#">Home</a></div></article>`};
  return {title:'Writing',html:top+`<div class="art"><h1>Writing</h1><div class="meta">${C.posts.length} ${C.posts.length===1?'post':'posts'}</div>${C.posts.length?`<ul class="plist">${C.posts.map(p=>`<li><p class="mono" style="margin:0">${postMeta(p)}</p><a href="#/writing/${esc(p.slug)}">${esc(p.title)}</a><p>${esc(firstPara(p))}</p></li>`).join('')}</ul>`:'<p>No posts yet.</p>'}<div class="foot"><a href="#">← Home</a><span></span></div></div>`};
}
function route(){
  const m=location.hash.match(/^#\/writing(?:\/([\w-]+))?\/?$/);
  if(m){
    if(!inView){homeY=scrollY;inView=true}
    const r=renderPage(m[1]);$('#page').innerHTML=r.html;document.body.classList.add('viewpage');
    document.title=r.title+' · '+C.name;scrollTo(0,0);
    const w=$('#where');if(w)w.textContent='Writing';
  }else if(inView){
    inView=false;document.body.classList.remove('viewpage');document.title=BASE_TITLE;$('#page').innerHTML='';
    applyNav();const h=location.hash.slice(1);
    if(h&&SECK[h])setTimeout(()=>goSec(SECK[h]),30);else scrollTo(0,homeY);
    lastY=scrollY;
  }
}
addEventListener('hashchange',route);
route();
</script>
</body>
</html>
